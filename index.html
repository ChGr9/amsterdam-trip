<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#c2410c">
  <title>Amsterdam Family Trip</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="hero">
    <div class="hero-inner">
      <div class="hero-kicker" id="trip-dates"></div>
      <h1 id="trip-title">Amsterdam</h1>
      <p class="hero-sub" id="trip-subtitle"></p>
      <div class="hero-hotel" id="hotel-card"></div>
    </div>
    <div class="hero-wave" aria-hidden="true">
      <svg viewBox="0 0 1440 60" preserveAspectRatio="none"><path d="M0,30 C240,60 480,0 720,20 C960,40 1200,10 1440,30 L1440,60 L0,60 Z" fill="var(--bg)"/></svg>
    </div>
  </header>

  <nav class="section-nav" id="section-nav">
    <a href="#schedule" class="active" data-section="schedule">📅 Schedule</a>
    <a href="#explore" data-section="explore">🧭 Explore</a>
    <a href="#info" data-section="info">ℹ️ Info</a>
  </nav>

  <main>
    <section id="schedule">
      <div class="day-tabs" id="day-tabs" role="tablist" aria-label="Trip days"></div>
      <div id="day-content"></div>
    </section>

    <section id="explore">
      <h2 class="section-title"><span>🧭</span> Explore places</h2>
      <p class="section-lede">Everything worth eating and visiting — filter it down to what you fancy.</p>

      <div class="explore-controls">
        <div class="filter-row" id="city-filters" aria-label="City"></div>
        <div class="filter-row" id="kind-filters" aria-label="Type"></div>

        <div class="control-grid">
          <input type="search" id="search-box" class="control" placeholder="🔍 Search places…" aria-label="Search places">
          <select id="category-select" class="control" aria-label="Category"></select>
          <select id="price-select" class="control" aria-label="Price">
            <option value="">Any price</option>
            <option value="€">€ cheap</option>
            <option value="€€">€€ mid</option>
            <option value="€€€">€€€ fancy</option>
          </select>
          <select id="sort-select" class="control" aria-label="Sort">
            <option value="name">Sort: A–Z</option>
            <option value="price">Sort: price</option>
            <option value="distance">Sort: nearest</option>
          </select>
          <select id="radius-select" class="control" aria-label="Distance filter">
            <option value="">Any distance</option>
            <option value="0.5">Within 500 m</option>
            <option value="1">Within 1 km</option>
            <option value="2">Within 2 km</option>
            <option value="5">Within 5 km</option>
          </select>
          <button id="locate-btn" class="control control-btn">📍 Use my location</button>
        </div>
        <p class="locate-status" id="locate-status"></p>
      </div>

      <p class="result-count" id="result-count"></p>
      <div class="card-grid" id="place-grid"></div>
      <div class="pagination" id="pagination"></div>
    </section>

    <section id="info">
      <h2 class="section-title"><span>ℹ️</span> Good to know</h2>
      <div class="card-grid" id="info-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p id="footer-text"></p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
